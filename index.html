<style>
:root{--bg:#f5f4f0;--fg:#26251f;--line:#d8d6cd;--btn:#ffffff;--radius:8px}

:root[data-theme="dark"]{--bg:#17171a;--fg:#e7e5dd;--line:#33332f;--btn:#242428}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}

body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{max-width:1100px;margin:0 auto;padding:10px;height:100%;display:flex;flex-direction:column}
h1{font-size:17px;font-weight:500;margin:4px 2px 10px}
#bar,#bar2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#bar2 button{padding:10px 14px;font-size:14px}
body{-webkit-text-size-adjust:100%}
button{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);background:var(--btn);color:var(--fg);border-radius:var(--radius);cursor:pointer}
button:hover{border-color:#9a9890}
button.on{background:#26251f;color:#f5f4f0;border-color:#26251f}
#view{width:100%;flex:1 1 auto;min-height:220px;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background:#c9d3d8}
#view canvas{display:block;width:100%!important;height:100%!important;max-width:100%}
p.note{flex:0 0 auto;font-size:13px;line-height:1.6;opacity:.75;margin:10px 2px 2px}
</style>
<div id="wrap">
<h1>Hexagona, variante parvis et enseignes WIDE</h1>
<div id="bar">
<button id="brdc">Rez-de-chaussée</button>
<button id="betg" class="on">Étage</button>
</div>
<div id="bar2">
<button id="btoit" class="on">Toit</button>
<button id="bzin">Zoom +</button>

<button id="brst">Recentrer</button>
</div>
<div id="view"></div>
<p class="note">Un doigt pour tourner, deux doigts pour zoomer, Recentrer pour revenir a la vue de depart.</p>

var target=new THREE.Vector3(13,2,0), radius=57, theta=0.6, phi=1.0;
function apply(){
 camera.position.set(
  target.x+radius*Math.sin(phi)*Math.sin(theta),
  target.y+radius*Math.cos(phi),
  target.z+radius*Math.sin(phi)*Math.cos(theta));
 camera.lookAt(target);
}
function setCam(px,py,pz,tx,ty,tz){
 target.set(tx,ty,tz);
 var dx=px-tx,dy=py-ty,dz=pz-tz;
 radius=Math.sqrt(dx*dx+dy*dy+dz*dz);
 theta=Math.atan2(dx,dz);
 phi=Math.acos(Math.max(-1,Math.min(1,dy/radius)));
 apply();
}

var drag=false,lx=0,ly=0;
function down(x,y){drag=true;lx=x;ly=y;}
function move(x,y){
 if(!drag)return;
 theta-=(x-lx)*0.006;
 phi=Math.max(0.05,Math.min(1.56,phi-(y-ly)*0.006));
 lx=x;ly=y;apply();
}

});

function unscroll(){window.scrollTo(0,0);if(document.scrollingElement){document.scrollingElement.scrollTop=0;document.scrollingElement.scrollLeft=0;}}
var pinch=0;
function tdist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)||1;}
host.addEventListener('touchstart',function(e){
 if(e.touches.length===1){pinch=0;down(e.touches[0].clientX,e.touches[0].clientY);}
 else if(e.touches.length>=2){drag=false;pinch=tdist(e.touches);}
},{passive:true});
host.addEventListener('touchmove',function(e){
 if(e.touches.length>=2){
  var d=tdist(e.touches);
  if(pinch>0){radius=Math.max(2.0,Math.min(130,radius*(pinch/d)));apply();}
  pinch=d;e.preventDefault();
 }else if(e.touches.length===1&&drag){
  move(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();
 }
},{passive:false});
host.addEventListener('touchend',function(e){if(e.touches.length===0){drag=false;}pinch=0;});
host.addEventListener('touchcancel',function(){drag=false;pinch=0;});
host.addEventListener('wheel',function(e){
 e.preventDefault();
 radius=Math.max(2.0,Math.min(130,radius*(1+e.deltaY*0.0012)));
 apply();
},{passive:false});

 cv.style.width=w+"px"; cv.style.height=h+"px";
 camera.aspect=w/h; camera.updateProjectionMatrix();
}
